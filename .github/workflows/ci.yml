name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Testes unitários
        run: mvn -B test
      - name: Demo de ponta a ponta (monitor + simulador benigno)
        run: bash lab.sh demo
